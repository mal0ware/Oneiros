name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project + dev dependencies
        # `pip install -e .` puts the oneiros package itself on the path —
        # without it every test module fails collection with
        # ModuleNotFoundError (first real CI run, 2026-07-14).
        run: |
          pip install -e .
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check oneiros tests

      # The committed checkpoints (oneiros/checkpoint.pt and
      # oneiros/checkpoint_image.pt) let the inference and planning tests —
      # including the vector honesty gates AND the pixel gates — run without
      # retraining, keeping CI fast and deterministic. Training itself is
      # exercised locally via `python -m oneiros.train`.
      - name: Run tests (uses committed checkpoints)
        run: pytest -q
