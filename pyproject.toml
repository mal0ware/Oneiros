[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oneiros"
version = "0.2.0"
description = "JEPA-style latent world model with an agentic MCP planning interface"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marius Castillo" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    # 2.x: MCPServer API; sync tools run on worker threads, so the server
    # serializes tool calls itself (see oneiros/mcp_server.py).
    "mcp>=2,<3",
    "pillow>=10.0",
    "imageio>=2.30",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
oneiros-train = "oneiros.train:main"
oneiros-demo = "oneiros.demo_agent:main"
oneiros-mcp = "oneiros.mcp_server:main"

[tool.setuptools]
packages = ["oneiros"]

[tool.setuptools.package-data]
# ship the trained checkpoints so the console scripts and MCP server work
# from a wheel install, not just a repo checkout.
oneiros = ["checkpoint.pt", "checkpoint_image.pt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
